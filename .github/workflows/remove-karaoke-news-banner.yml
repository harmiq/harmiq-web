name: Remove retired karaoke news banner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired banner code
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          original = s
          s = s.replace('  injectNewsBanner(); // Inyectar banner de novedades\n', '')
          s = re.sub(r'\/\*\*\s*\n \* injectNewsBanner\(\)[\s\S]*?\nfunction showCookieBanner\(\)', 'function showCookieBanner()', s, count=1)
          if s == original:
              raise SystemExit('No banner code change was necessary')
          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'fix: remove retired karaoke news banner'
          git push
