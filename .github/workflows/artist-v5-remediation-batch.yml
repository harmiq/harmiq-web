name: Artist V5 directory remediation batch

on:
  push:
    branches:
      - adsense-editorial-hardening
    paths:
      - scripts/remediate-v5-directory-pages.mjs
      - scripts/audit-residual-directory-templates.mjs
      - .github/workflows/artist-v5-remediation-batch.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/remediate-v5-directory-pages.mjs
      - scripts/audit-residual-directory-templates.mjs
      - .github/workflows/artist-v5-remediation-batch.yml

permissions:
  contents: write

jobs:
  apply-batch:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Run bounded exact-template batch 10 retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-editorial-hardening

      - name: Validate and preview exact candidates
        run: |
          node --check scripts/remediate-v5-directory-pages.mjs
          node scripts/remediate-v5-directory-pages.mjs --dry-run > preflight.json
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("preflight.json", "utf8"));
            if (r.eligibleExactTemplatePages < 100) throw new Error("Expected at least 100 exact candidates; found " + r.eligibleExactTemplatePages);
            console.log("Preflight passed: " + r.eligibleExactTemplatePages + " exact candidates.");
          '

      - name: Apply bounded batch of 100
        run: |
          node scripts/remediate-v5-directory-pages.mjs --apply --limit=100 > applied.json
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("applied.json", "utf8"));
            if (r.selectedForThisBatch !== 100 || r.changed.length !== 100) throw new Error("Expected exactly 100 changed pages.");
            console.log(JSON.stringify({ changed: r.changed.length, slugs: r.changed }, null, 2));
          '

      - name: Commit, rebase, and push bounded content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artistas
          git commit -m "Remediate 100 exact generic directory pages"
          git fetch origin adsense-editorial-hardening
          git rebase origin/adsense-editorial-hardening
          git push origin HEAD:adsense-editorial-hardening

  preview-only:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.head_commit.message != 'Run bounded exact-template batch 10 retry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-editorial-hardening

      - name: Validate remediation and audit syntax
        run: |
          node --check scripts/remediate-v5-directory-pages.mjs
          node --check scripts/audit-residual-directory-templates.mjs

      - name: Preview remaining exact-template pages
        run: |
          node scripts/remediate-v5-directory-pages.mjs --dry-run > remediation-preview.json
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("remediation-preview.json", "utf8"));
            console.log(JSON.stringify({
              mode: r.mode,
              eligibleExactTemplatePages: r.eligibleExactTemplatePages,
              skippedByReason: r.skippedByReason
            }, null, 2));
          '
