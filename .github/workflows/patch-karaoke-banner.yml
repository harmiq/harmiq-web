name: Patch karaoke event banner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch retired converter link only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old='b.href = "/karaoke.html";'
          new='b.href = "/karaoke-eventos.html";'
          if old not in s:
              raise SystemExit('Expected retired karaoke banner reference was not found')
          s=s.replace(old,new)
          if '/karaoke.html' in s:
              raise SystemExit('A retired /karaoke.html reference remains')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/patch-karaoke-banner.yml karaoke-banner-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows
          git commit -m 'fix: retire old karaoke converter link' || true
          git push origin HEAD:main
