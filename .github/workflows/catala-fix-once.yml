name: One-time Catalan artwork override fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace all Wikimedia Catalan artwork URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modul-catala.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'https://commons.wikimedia.org/wiki/Special:FilePath/La%20Sagrada%20Familia%20Barcelona.jpg?width=1200': '/assets/catala/barcelona.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Onyar%20River%20Houses.JPG?width=1200': '/assets/catala/girona.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Tarragona%20Amphitheatre.jpg?width=1200': '/assets/catala/tarragona.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Seu%20vella%20de%20lleida.jpg?width=1200': '/assets/catala/lleida.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/La%20Sagrada%20Familia%20Barcelona.jpg?width=1000': '/assets/catala/barcelona.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Onyar%20River%20Houses.JPG?width=1000': '/assets/catala/girona.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Tarragona%20Amphitheatre.jpg?width=1000': '/assets/catala/tarragona.svg',
            'https://commons.wikimedia.org/wiki/Special:FilePath/Seu%20vella%20de%20lleida.jpg?width=1000': '/assets/catala/lleida.svg',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if 'commons.wikimedia.org' in s:
              raise SystemExit('Remote Wikimedia image references remain in modul-catala.html')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modul-catala.html
          git commit -m 'fix: remove stale Catalan photo override'
          git rm .github/workflows/catala-fix-once.yml
          git commit -m 'chore: remove one-time Catalan fix workflow'
          git push
