name: Post-review fixes
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[post-review]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize SEO canonicals and legacy references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'modul-catala.html': [('https://harmiq.app/modul-catala.html','https://harmiq.app/modul-catala')],
              'exitos-decada.html': [('https://harmiq.app/exitos-decada.html','https://harmiq.app/exitos-decada')],
          }
          for name, pairs in replacements.items():
              p=Path(name)
              if p.exists():
                  s=p.read_text(encoding='utf-8')
                  for a,b in pairs:
                      s=s.replace(a,b)
                  p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<section class="analyzer-section" id="analizador">'
          if marker in s and 'id="analizar"' not in s:
              s=s.replace(marker, '<span id="analizar" aria-hidden="true"></span>\n    '+marker, 1)
          p.write_text(s,encoding='utf-8')

          p=Path('home-studio/index.html')
          s=p.read_text(encoding='utf-8')
          if 'ca-pub-6942632470990007' not in s:
              ads='<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6942632470990007" crossorigin="anonymous"></script>'
              ga='<script async src="https://www.googletagmanager.com/gtag/js?id=G-0S4XEG0J2M"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-0S4XEG0J2M");</script>'
              s=s.replace('</head>', ads+'\n'+ga+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate critical cleanup
        run: |
          ! grep -Rni 'karaoke.html' --exclude-dir=.git .
          ! grep -Rni 'Conversor Libre Karaoke' --exclude-dir=.git .
          test -f modul-catala.html
          test -f exitos-decada.html
          test -f home-studio/index.html
          test -f artistas/index.json
          test -f app.js
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/post-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: polish unified Harmiq frontend [post-review]' || exit 0
          git push origin HEAD:main
