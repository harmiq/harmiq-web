name: One-time Tarragona cache bust
on:
  push:
    branches: [main]
jobs:
  bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update Tarragona asset URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modul-catala.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('/assets/catala/tarragona.svg?v=3', '/assets/catala/tarragona.svg?v=4')
          if s2 == s:
              raise SystemExit('Tarragona v3 reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modul-catala.html
          git commit -m 'Bust Tarragona Catalan artwork cache'
          git push
          rm .github/workflows/one-time-catala-tarragona-v4.yml
          git add .github/workflows/one-time-catala-tarragona-v4.yml
          git commit -m 'Remove one-time Tarragona cache workflow'
          git push
