name: Finalize Catalan module
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize and finalize
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('modul-catala.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('\\"','"')
          clean_loader=r'''<script id="harmiq-catala-image-loader">
          (() => {
            const langs = ['ca','es','en'];
            const cache = new Map();
            const clean = v => (v || '').replace(/\s+/g, ' ').trim();
            async function getImage(name) {
              const key = name.toLowerCase();
              if (cache.has(key)) return cache.get(key);
              const promise = (async () => {
                for (const lang of langs) {
                  try {
                    const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`, {cache:'force-cache'});
                    if (!r.ok) continue;
                    const d = await r.json();
                    const url = d?.originalimage?.source || d?.thumbnail?.source;
                    if (url) return url;
                  } catch (_) {}
                }
                return null;
              })();
              cache.set(key, promise);
              return promise;
            }
            async function loadCard(card) {
              if (card.dataset.photoLoaded) return;
              const name = clean(card.querySelector('h3,h4,strong')?.textContent);
              const wrap = card.querySelector('.art-av-wrap');
              const fallback = card.querySelector('.art-av');
              if (!name || !wrap) return;
              card.dataset.photoLoaded = '1';
              const url = await getImage(name);
              if (!url) return;
              const img = document.createElement('img');
              img.className = 'art-photo';
              img.src = url;
              img.alt = `${name} — artista de música en català`;
              img.loading = 'lazy';
              img.decoding = 'async';
              img.addEventListener('load', () => { img.classList.add('loaded'); if (fallback) fallback.classList.add('hidden'); }, {once:true});
              img.addEventListener('error', () => img.remove(), {once:true});
              wrap.prepend(img);
            }
            const observer = 'IntersectionObserver' in window ? new IntersectionObserver(entries => entries.forEach(entry => { if (!entry.isIntersecting) return; loadCard(entry.target); observer.unobserve(entry.target); }), {rootMargin:'900px 0px'}) : null;
            function scan() { document.querySelectorAll('#ag .art-card, #eg .art-card').forEach(card => observer ? observer.observe(card) : loadCard(card)); }
            function start() { scan(); new MutationObserver(scan).observe(document.body, {childList:true, subtree:true}); }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true}); else start();
          })();
          </script>
          '''
          s=re.sub(r'\\n<script id="harmiq-catala-image-loader">.*?</script>\\n','\n',s,flags=re.S)
          s=re.sub(r'<script id="harmiq-catala-image-loader">.*?</script>','',s,flags=re.S)
          s=s.replace('</body>',clean_loader+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          h=Path('_headers'); hs=h.read_text(encoding='utf-8').replace('https://en.wikipedia.org https://itunes.apple.com','https://*.wikipedia.org https://itunes.apple.com'); h.write_text(hs,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'Música en català' modul-catala.html
          grep -q 'harmiq-catala-image-loader' modul-catala.html
          grep -q 'Special:FilePath/La%20Sagrada%20Familia%20Barcelona.jpg' modul-catala.html
          grep -q 'wikipedia.org' _headers
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modul-catala.html _headers
          git commit -m "fix: finalize Catalan imagery loader"
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/catala-finalize.yml
          git commit -m "chore: remove temporary Catalan finalize workflow"
          git push
