name: Unify rich Harmiq frontend

on:
  push:
    branches:
      - feat/unify-rich-harmiq
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unify:
    if: ${{ !contains(github.event.head_commit.message, 'unify rich Harmiq frontend') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harmiq-web
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Overlay the functional V1 frontend
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/harmiq/harmiq_finalV1.git "$tmp/harmiq_finalV1"

          # Preserve the newer harmiq-web pages that must survive the overlay.
          mkdir -p "$tmp/preserve"
          for p in home-studio que-cantante-soy que-tipo-de-voz-tengo politica-privacidad; do
            if [ -e "$p" ]; then cp -a "$p" "$tmp/preserve/"; fi
          done

          # Replace the frontend root with the richer, working Cloudflare frontend.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name "$tmp" -exec rm -rf {} +
          cp -a "$tmp/harmiq_finalV1/cloudflare/." .

          # Restore the newer SEO/monetization pages.
          for p in home-studio que-cantante-soy que-tipo-de-voz-tengo politica-privacidad; do
            if [ -e "$tmp/preserve/$p" ]; then rm -rf "$p"; cp -a "$tmp/preserve/$p" "$p"; fi
          done

          rm -rf "$tmp"

      - name: Remove the experimental karaoke converter from the public frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          # Remove the complete old converter card, not merely hide it with JS.
          html = re.sub(
              r'\s*<!--\s*Tarjeta:\s*Karaoke Converter.*?</a>\s*',
              '\n',
              html,
              flags=re.S | re.I,
          )
          # Safety net: remove any remaining anchor whose destination is the deleted converter.
          html = re.sub(
              r'\s*<a\b[^>]*href=["\']/karaoke\.html["\'][^>]*>.*?</a>\s*',
              '\n',
              html,
              flags=re.S | re.I,
          )
          index.write_text(html, encoding='utf-8')

          # Never publish the deleted converter page or links to it.
          Path('karaoke.html').unlink(missing_ok=True)
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              text2 = text.replace('/karaoke.html', '#')
              if text2 != text:
                  p.write_text(text2, encoding='utf-8')
          PY

      - name: Keep Home Studio linked to the current SEO page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="/home-studio.html"', 'href="/home-studio/"')
          s = s.replace("href='/home-studio.html'", "href='/home-studio/'")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Add AdSense and Analytics to the unified homepage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          adsense = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6942632470990007" crossorigin="anonymous"></script>'
          ga = '''<script async src="https://www.googletagmanager.com/gtag/js?id=G-0S4XEG0J2M"></script>\n<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-0S4XEG0J2M');</script>'''
          if 'ca-pub-6942632470990007' not in s:
              s = s.replace('</head>', f'    {adsense}\n    {ga}\n</head>', 1)
          elif 'G-0S4XEG0J2M' not in s:
              s = s.replace('</head>', f'    {ga}\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply the current security headers and allow required ad domains
        shell: bash
        run: |
          set -euo pipefail
          if [ -f _headers ]; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('_headers')
          s=p.read_text(encoding='utf-8')
          # The existing V1 CSP is retained; add only the Google origins required by AdSense/GA.
          if 'googletagmanager.com' not in s:
              s=s.replace('script-src ', 'script-src https://www.googletagmanager.com https://pagead2.googlesyndication.com ')
          if 'googlesyndication.com' not in s:
              s=s.replace('script-src ', 'script-src https://pagead2.googlesyndication.com ')
          if 'googletagmanager.com' not in s:
              s=s.replace('connect-src ', 'connect-src https://www.google-analytics.com ')
          p.write_text(s, encoding='utf-8')
          PY
          fi

      - name: Build canonical sitemap for the unified site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape

          root = Path('.')
          urls = set()
          for p in root.rglob('index.html'):
              if '.git' in p.parts:
                  continue
              rel = p.parent.as_posix()
              if rel == '.': url = 'https://harmiq.app/'
              else: url = 'https://harmiq.app/' + rel.strip('/') + '/'
              urls.add(url)

          # Standalone public HTML modules.
          for p in root.glob('*.html'):
              if p.name.lower() == 'karaoke.html':
                  continue
              urls.add('https://harmiq.app/' + p.stem)

          # Canonical voice taxonomy used by the rich V1 site.
          for slug in ('soprano','mezzo-soprano','tenor','baritono','bajo','contralto'):
              urls.add(f'https://harmiq.app/tipo-de-voz/{slug}/')

          lines=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in sorted(urls):
              lines.append(f'  <url><loc>{escape(u)}</loc></url>')
          lines.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Validate unified frontend
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f config.js
          test -d artistas
          test -f artistas/index.json
          test -d tipos-de-voz
          test -d tipo-de-voz
          test -f modul-catala.html
          test -f exitos-decada.html
          test -f home-studio/index.html
          test -f que-cantante-soy/index.html
          test -f que-tipo-de-voz-tengo/index.html
          test -f politica-privacidad/index.html
          test ! -e karaoke.html
          ! grep -R --exclude-dir=.git -n '/karaoke\.html' .
          grep -q 'ca-pub-6942632470990007' index.html
          grep -q 'G-0S4XEG0J2M' index.html
          test "$(find . -type f -not -path './.git/*' | wc -l)" -lt 20000

      - name: Commit generated unified frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/unify-rich-harmiq.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify rich Harmiq frontend" || exit 0
          git push origin HEAD:feat/unify-rich-harmiq
