name: SEO home pass

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    if: github.event.head_commit.message != 'chore: improve homepage SEO metadata and structured data'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Improve homepage SEO
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    <title>Harmiq — Descubre tu ADN Vocal con IA</title>\n    <meta name="description" content="Análisis de voz con IA gratuito. Descubre tu tipo de voz, qué cantante eres y mejora tu técnica vocal. La plataforma definitiva para cantantes.">\n    <link rel="canonical" href="https://harmiq.app/">'''
          new = '''    <title>Harmiq — Análisis Vocal con IA | Tipo de Voz y Cantante Similar</title>\n    <meta name="description" content="Analiza tu voz gratis con IA. Descubre tu tipo de voz, rango vocal y los artistas que más se parecen a ti. Explora cantantes, canciones y recursos para mejorar tu voz.">\n    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n    <meta name="theme-color" content="#05040d">\n    <meta property="og:type" content="website">\n    <meta property="og:site_name" content="Harmiq">\n    <meta property="og:title" content="Harmiq — Análisis Vocal con IA | Tipo de Voz y Cantante Similar">\n    <meta property="og:description" content="Analiza tu voz gratis con IA. Descubre tu tipo de voz, rango vocal y los artistas que más se parecen a ti.">\n    <meta property="og:url" content="https://harmiq.app/">\n    <meta property="og:image" content="https://harmiq.app/harmiq-logo.png">\n    <meta name="twitter:card" content="summary">\n    <meta name="twitter:title" content="Harmiq — Análisis Vocal con IA">\n    <meta name="twitter:description" content="Descubre tu tipo de voz y qué artistas se parecen a ti con el análisis vocal de Harmiq.">\n    <meta name="twitter:image" content="https://harmiq.app/harmiq-logo.png">\n    <link rel="canonical" href="https://harmiq.app/">'''
          if old not in s:
              raise SystemExit('Expected homepage SEO block not found; no changes made.')
          s = s.replace(old, new, 1)

          marker = '''    <link rel="preconnect" href="https://fonts.googleapis.com">'''
          schema = '''    <script type="application/ld+json">\n    {\n      "@context": "https://schema.org",\n      "@graph": [\n        {\n          "@type": "Organization",\n          "@id": "https://harmiq.app/#organization",\n          "name": "Harmiq",\n          "url": "https://harmiq.app/",\n          "logo": {\n            "@type": "ImageObject",\n            "url": "https://harmiq.app/harmiq-logo.png"\n          }\n        },\n        {\n          "@type": "WebSite",\n          "@id": "https://harmiq.app/#website",\n          "url": "https://harmiq.app/",\n          "name": "Harmiq",\n          "description": "Plataforma de análisis vocal con IA para descubrir tu tipo de voz y artistas similares.",\n          "publisher": {"@id": "https://harmiq.app/#organization"},\n          "inLanguage": ["es", "en", "ca", "fr", "de", "it", "pt", "ja", "ru", "uk"]\n        },\n        {\n          "@type": "WebApplication",\n          "@id": "https://harmiq.app/#application",\n          "name": "Harmiq",\n          "url": "https://harmiq.app/",\n          "applicationCategory": "MusicApplication",\n          "operatingSystem": "Web",\n          "isAccessibleForFree": true,\n          "description": "Analizador vocal online con IA que estima tipo de voz, rango vocal y similitud con artistas.",\n          "publisher": {"@id": "https://harmiq.app/#organization"}\n        }\n      ]\n    }\n    </script>\n'''
          if 'https://harmiq.app/#application' not in s:
              s = s.replace(marker, schema + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: improve homepage SEO metadata and structured data"
          git push