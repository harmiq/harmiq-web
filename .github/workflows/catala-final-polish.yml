name: Final Catalan visual polish
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Catalan page
        run: |
          if git log -1 --pretty=%s | grep -q '^feat: finalize Catalan visual'; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modul-catala.html')
          s=p.read_text()
          replacements={
            '<title>Música Catalana — Artistes i Karaoke | Harmiq</title>':'<title>Música en català — Artistes, cançons i cultura | Harmiq</title>',
            '<div class="nav-right">🏴 Mòdul Català</div>':'<div class="nav-right">🎵 Música en català</div>',
            '<div class="v5-kicker">Harmiq · Secció catalana</div>':'<div class="v5-kicker">Harmiq · Música en català</div>'
          }
          for a,b in replacements.items():
            if a not in s: print('WARN anchor missing:',a)
            s=s.replace(a,b,1)
          s=s.replace('<meta name="description" content="Descobreix l\'ADN de la música catalana amb Harmiq. Canta Oques Grasses, The Tyets, Rosalía, artistes catalans contemporanis i descobreix els millors grups emergents i grups de versions per a Festes Majors.">','<meta name="description" content="Descobreix la música en català amb Harmiq: artistes, cançons, història, cultura i noves veus de Catalunya, el País Valencià i les Illes Balears.">',1)
          s=s.replace('<meta name="keywords" content="musica catalana, artistes catalans, grups emergents, karaokes, festes majors, grups de versions, analisis de voz ia, the tyets, oques grasses">','<meta name="keywords" content="música en català, música catalana, artistes catalans, cançons en català, grups catalans, escena musical catalana, Oques Grasses, The Tyets, Julieta">',1)

          # Remove the previous experimental image scripts.
          for marker in ['harmiq-catala-v5-image-polish','harmiq-catala-v5-real-images','harmiq-catala-v5-enhancer']:
            start=s.find(f'<style id="{marker}">')
            if start==-1: start=s.find(f'<script id="{marker}">')
            if start!=-1:
              end=s.find('</style>',start) if s[start:].startswith('<style') else s.find('</script>',start)
              if end!=-1: s=s[:start]+s[end+len('</style>' if s[start:].startswith('<style') else '</script>'):]

          inject=r'''<style id="harmiq-catala-image-polish">
  .art-card .art-av-wrap{position:relative!important;overflow:hidden!important;background:linear-gradient(135deg,#10283a,#0a1119)!important}
  .art-card .art-photo{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:block!important;object-fit:cover!important;object-position:center!important;z-index:1!important;opacity:0;transition:opacity .35s ease,transform .5s ease,filter .35s ease!important}
  .art-card .art-photo.loaded{opacity:1}.art-card:hover .art-photo.loaded{transform:scale(1.045);filter:saturate(1.08)}
  .art-card .art-av{z-index:0!important;transition:opacity .25s ease!important}.art-card .art-av.hidden{opacity:0}
  .v5-province{transition:transform .35s ease,filter .35s ease}.v5-province:hover{filter:saturate(1.08);transform:translateY(-3px) skewX(-4deg)}
  .v5-province.has-photo{background-size:cover!important;background-position:center!important}.v5-province.has-photo:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,8,14,.10),rgba(2,8,14,.78));z-index:1}
  @media(max-width:900px){.v5-province:hover{transform:translateY(-3px)}}
</style>
<script id="harmiq-catala-image-loader">
(() => {
  const langs=['ca','es','en'], cache=new Map();
  const clean=s=>(s||'').replace(/\s+/g,' ').trim();
  async function image(name){
    const key=clean(name).toLowerCase(); if(!key)return null; if(cache.has(key))return cache.get(key);
    const p=(async()=>{for(const l of langs){try{const r=await fetch(`https://${l}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`,{cache:'force-cache'});if(!r.ok)continue;const d=await r.json();if(d?.thumbnail?.source)return d.thumbnail.source;}catch(_){}}return null;})();cache.set(key,p);return p;
  }
  function card(c){if(c.dataset.imageStarted)return;const name=clean(c.querySelector('h3,h4,strong')?.textContent),wrap=c.querySelector('.art-av-wrap'),fallback=c.querySelector('.art-av');if(!name||!wrap||!fallback)return;c.dataset.imageStarted='1';image(name).then(url=>{if(!url)return;const i=document.createElement('img');i.className='art-photo';i.alt=name;i.loading='lazy';i.decoding='async';i.src=url;i.onload=()=>{i.classList.add('loaded');fallback.classList.add('hidden')};i.onerror=()=>i.remove();wrap.insertBefore(i,wrap.firstChild)});}
  function province(e){if(e.dataset.imageStarted)return;e.dataset.imageStarted='1';image(clean(e.dataset.artist)).then(url=>{if(url){e.style.backgroundImage=`linear-gradient(180deg,rgba(2,8,14,.10),rgba(2,8,14,.78)),url("${url.replace(/"/g,'\\"')}")`;e.classList.add('has-photo')}});}
  function scan(){document.querySelectorAll('#ag .art-card,#eg .art-card').forEach(card);document.querySelectorAll('.v5-province[data-artist]').forEach(province)}
  const obs=new MutationObserver(scan); const start=()=>{scan();obs.observe(document.body,{childList:true,subtree:true})};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
'''
          s=s.replace('</body>',inject+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modul-catala.html
          git commit -m 'feat: finalize Catalan visual'
          git push
