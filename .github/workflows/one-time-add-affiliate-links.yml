name: One-time add affiliate links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add affiliate links to resources
        env:
          LALAL: 'https://www.lalal.ai/?fp_ref=david-91ee46'
          UDEMY: 'https://trk.udemy.com/6k1Dyq'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('recursos/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('href="https://www.lalal.ai/es/" target="_blank" rel="noopener"', 'href="https://www.lalal.ai/?fp_ref=david-91ee46" target="_blank" rel="sponsored noopener"')

          marker = '<a class="card" href="/" style="--glow:rgba(124,77,255,.3)">'
          udemy = '<a class="card" href="https://trk.udemy.com/6k1Dyq" target="_blank" rel="sponsored noopener"><span class="tag">CURSO · UDEMY</span><div class="icon">🎓</div><h3>Curso completo de canto y técnica vocal</h3><p>Aprende técnica vocal, respiración y recursos prácticos para trabajar tu voz y mejorar tu canto.</p><span class="go">Ver curso en Udemy →</span></a>\n'
          if 'href="https://trk.udemy.com/6k1Dyq"' not in s and marker in s:
              s = s.replace(marker, udemy + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/index.html
          git commit -m 'Add affiliate links for LALAL.AI and Udemy' || true
          git push
          rm -f .github/workflows/one-time-add-affiliate-links.yml
          git add .github/workflows/one-time-add-affiliate-links.yml
          git commit -m 'Remove one-time affiliate workflow' || true
          git push
