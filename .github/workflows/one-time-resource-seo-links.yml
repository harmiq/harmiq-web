name: One-time resource SEO links

on:
  push:
    paths:
      - '.github/workflows/one-time-resource-seo-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update resources hub and sitemap
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('recursos/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="https://www.lalal.ai/?fp_ref=david-91ee46" target="_blank" rel="sponsored noopener" style="--glow:rgba(255,79,163,.2)"', 'href="/recursos/lalal-ai/" style="--glow:rgba(255,79,163,.2)"')
          s = s.replace('href="https://www.lalal.ai/?fp_ref=david-91ee46" target="_blank" rel="sponsored noopener"', 'href="/recursos/lalal-ai/"')
          s = s.replace('href="https://trk.udemy.com/6k1Dyq" target="_blank" rel="sponsored noopener"', 'href="/recursos/udemy-canto/"')
          p.write_text(s, encoding='utf-8')

          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          anchor = '  <url><loc>https://harmiq.app/recursos/</loc></url>'
          additions = anchor + '\n  <url><loc>https://harmiq.app/recursos/lalal-ai/</loc></url>\n  <url><loc>https://harmiq.app/recursos/udemy-canto/</loc></url>'
          if 'https://harmiq.app/recursos/lalal-ai/' not in s:
              s = s.replace(anchor, additions, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos/index.html sitemap.xml
          git commit -m 'Link resource hub to SEO landing pages' || true
          git rm .github/workflows/one-time-resource-seo-links.yml
          git commit -m 'Remove one-time resource SEO workflow' || true
          git push
