name: Rename Catalan section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename visible section label
        run: |
          grep -RIl --include='*.html' 'Mòdul Català' . | xargs -r sed -i 's/Mòdul Català/Música en català/g'
          grep -RIl --include='*.html' 'Mòdul Català' . | xargs -r sed -i 's/Mòdul Català/Música en català/g'
      - name: Validate
        run: |
          ! grep -RIl --include='*.html' 'Mòdul Català' . | grep -q .
          grep -RIl --include='*.html' 'Música en català' . | grep -q .
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.html'
          git diff --cached --quiet || git commit -m "fix: rename Catalan music section"
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/rename-catala-section.yml
          git commit -m "chore: remove temporary rename workflow"
          git push
