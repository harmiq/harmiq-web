name: One-time sitemap cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean sitemap
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("sitemap.xml")
          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          root = ET.fromstring(path.read_text(encoding="utf-8"))
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

          canonical_no_slash = {
              "https://harmiq.app/modul-catala",
              "https://harmiq.app/exitos-decada",
          }
          canonical_slash = {
              "https://harmiq.app/home-studio/",
              "https://harmiq.app/politica-privacidad/",
          }

          seen = set()
          removed = []
          for url in list(root.findall(f"{ns}url")):
              loc = url.find(f"{ns}loc")
              value = (loc.text or "").strip() if loc is not None else ""

              # /index is an unnecessary duplicate of the homepage.
              if value == "https://harmiq.app/index":
                  root.remove(url)
                  removed.append(value)
                  continue

              # If both slash/no-slash forms exist, keep the known canonical form.
              if value.endswith("/") and value[:-1] in canonical_no_slash:
                  root.remove(url)
                  removed.append(value)
                  continue
              if value in canonical_slash and value[:-1] in seen:
                  # The no-slash duplicate was already seen; remove it from the tree.
                  root.remove(url)
                  removed.append(value)
                  continue
              if value.endswith("/") is False and value + "/" in canonical_slash:
                  # Keep only the slash form for known canonical routes.
                  root.remove(url)
                  removed.append(value)
                  continue

              if value in seen:
                  root.remove(url)
                  removed.append(value)
              else:
                  seen.add(value)

          # Rebuild a deterministic XML document without changing the URL set beyond cleanup.
          xml = ET.tostring(root, encoding="unicode")
          xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + xml + "\n"
          path.write_text(xml, encoding="utf-8")
          print(f"Removed {len(removed)} sitemap entries")
          for item in removed:
              print("-", item)

      - name: Commit sitemap cleanup and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git rm .github/workflows/fix-sitemap-cleanup.yml
          if git diff --cached --quiet; then
            echo "No sitemap changes needed."
            exit 0
          fi
          git commit -m "fix: clean sitemap duplicate URLs"
          git push
