name: One-time Catalan visuals
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace province backgrounds
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modul-catala.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '.v5-bcn{--prov-bg:radial-gradient(circle at 70% 30%,#2c6e9e,#111827 62%,#070b11)}': ".v5-bcn{--prov-bg:url('https://commons.wikimedia.org/wiki/Special:FilePath/La%20Sagrada%20Familia%20Barcelona.jpg?width=1400')}",
            '.v5-gir{--prov-bg:radial-gradient(circle at 45% 25%,#4e8c70,#14271f 58%,#07100d)}': ".v5-gir{--prov-bg:url('https://commons.wikimedia.org/wiki/Special:FilePath/Onyar%20River%20Houses.JPG?width=1400')}",
            '.v5-tar{--prov-bg:radial-gradient(circle at 65% 35%,#b46b43,#3b2117 58%,#120b08)}': ".v5-tar{--prov-bg:url('https://commons.wikimedia.org/wiki/Special:FilePath/Tarragona%20Amphitheatre.jpg?width=1400')}",
            '.v5-lle{--prov-bg:radial-gradient(circle at 50% 25%,#6e8f9c,#263742 58%,#0a1116)}': ".v5-lle{--prov-bg:url('https://commons.wikimedia.org/wiki/Special:FilePath/Seu%20vella%20de%20lleida.jpg?width=1400')}"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected CSS block: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modul-catala.html
          git commit -m 'feat: add Catalan province landmark imagery'
          git rm .github/workflows/catala-images-once.yml
          git commit -m 'chore: remove one-time Catalan visuals workflow'
          git push