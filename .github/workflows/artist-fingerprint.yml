name: Artist corpus fingerprint audit\n\non:\n  push:\n    branches:\n      - adsense-editorial-hardening\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  fingerprint:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout audit branch\n        uses: actions/checkout@v4\n\n      - name: Run artist fingerprint\n        run: node scripts/fingerprint-artist-pages.mjs > artist-fingerprint.json\n\n      - name: Publish compact audit summary\n        run: |\n          {\n            echo "## Artist corpus fingerprint audit"\n            echo\n            echo '```json'\n            node -e '\n              const fs = require("fs");\n              const r = JSON.parse(fs.readFileSync("artist-fingerprint.json", "utf8"));\n              console.log(JSON.stringify({\n                physicalPages: r.physicalPages,\n                directoryRecords: r.directoryRecords,\n                uniqueNormalizedFingerprints: r.uniqueNormalizedFingerprints,\n                repeatedFingerprintPages: r.repeatedFingerprintPages,\n                templateCounts: r.templateCounts\n              }, null, 2));\n            '\n            echo '```'\n          } >> "$GITHUB_STEP_SUMMARY"\n\n      - name: Upload full fingerprint report\n        uses: actions/upload-artifact@v4\n        with:\n          name: artist-fingerprint-report\n          path: artist-fingerprint.json\n